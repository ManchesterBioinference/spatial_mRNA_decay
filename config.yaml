# Snakemake Pipeline Configuration
# Spatial mRNA Decay Analysis

# Stripes to analyze
# Currently only stripe2 has data; stripe3 and stripe4 will be added when available
stripes:
- stripe2
- stripe3  # Now available with raw imaging data from Ali
#  - stripe4  # Uncomment when data/processed_mRNA_data_stripe4/ is available

# Embryos per stripe (for mRNA processing from raw imaging data)
# Stripe2 uses pre-processed data (e7, e8_9, e9_10 = nuclear cycle stages)
# Stripe3+ uses embryo numbering (e1, e2, e3, e4 = individual embryos)
embryos:
  stripe3:
  - e2
  - e4
  - e5

# Stripe AP coordinate ranges (data-driven, auto-detected by identify_stripe_ranges.py)
# Run: python scripts/identify_stripe_ranges.py to regenerate these values
stripe_ranges:
  stripe1:
    center: 0.295
    min: 0.235
    max: 0.355
  stripe2:
    center: 0.385
    min: 0.355
    max: 0.415
  stripe3:
    center: 0.495
    min: 0.455
    max: 0.535
  stripe4:
    center: 0.595
    min: 0.555
    max: 0.635
  stripe5:
    center: 0.685
    min: 0.635
    max: 0.735
n_ap_bins: 5          # Number of bins along anterior-posterior axis within selected range
n_dv_bins: 5          # Number of bins along dorsal-ventral axis
# dv_min: 0.33        # Minimum DV coordinate for cropping (optional)
# dv_max: 0.67        # Maximum DV coordinate for cropping (optional)
max_time_seconds: 1200  # Maximum time window (20 minutes)

# MCMC inference parameters
n_mcmc_samples: 10000  # Number of samples per chain
n_mcmc_chains: 4       # Number of parallel chains

# Optional: DV axis cropping
# Jenny's note: Cropping likely not needed - eve pattern is DV-invariant per AP bin
# Uncomment to enable:
# dv_crop_min: 0.33
# dv_crop_max: 0.67
stripe_ranges_metadata:
  last_updated: '2026-01-09 14:35:44'
  detection_method: peak detection with Savitzky-Golay smoothing
  prominence_threshold: 200.0
  bin_size: 0.01
